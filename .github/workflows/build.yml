---
name: build
on:
  schedule:
    # Daily at 03:00 UTC+8 (19:00 UTC previous day)
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: '1Cat-vLLM version tag (e.g. v1.2.2). Leave empty for latest.'
        required: false
        type: string
permissions:
  packages: write
  contents: read
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  check-and-build:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version_tag: ${{ steps.check.outputs.version_tag }}
      wheel_url: ${{ steps.check.outputs.wheel_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine latest 1Cat-vLLM release
        id: check
        run: |
          # Get latest release (or use input)
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(curl -sL "https://api.github.com/repos/1CatAI/1Cat-vLLM/releases/latest" | \
              python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          fi

          echo "Latest 1Cat-vLLM release: ${VERSION}"

          # Construct wheel URL
          WHEEL_URL="https://github.com/1CatAI/1Cat-vLLM/releases/download/${VERSION}/1cat_vllm-$(echo ${VERSION} | sed 's/v//')-cp312-cp312-linux_x86_64.whl"

          echo "Wheel URL: ${WHEEL_URL}"

          # Check if image already exists
          IMAGE_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="${{ env.REGISTRY }}/${IMAGE_LOWER}:${VERSION}"
          echo "Checking if ${IMAGE_TAG} already exists..."

          # Authenticated manifest check is more stable than raw API probing.
          if docker manifest inspect "${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "Image ${IMAGE_TAG} already exists. Skipping build."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "Image ${IMAGE_TAG} does not exist. Will build."
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

          echo "version_tag=${VERSION}" >> $GITHUB_OUTPUT
          echo "wheel_url=${WHEEL_URL}" >> $GITHUB_OUTPUT

  build:
    needs: check-and-build
    if: needs.check-and-build.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          VERSION="${{ needs.check-and-build.outputs.version_tag }}"
          IMAGE_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${{ env.REGISTRY }}/${IMAGE_LOWER}" >> $GITHUB_OUTPUT
          echo "tag=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: |
            VLLM_WHEEL_URL=${{ needs.check-and-build.outputs.wheel_url }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Docker Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Image: \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Also tagged: \`${{ steps.meta.outputs.image }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1Cat-vLLM version: ${{ needs.check-and-build.outputs.version_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "Wheel: ${{ needs.check-and-build.outputs.wheel_url }}" >> $GITHUB_STEP_SUMMARY
