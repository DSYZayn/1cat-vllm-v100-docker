name: Build Rolling Docker Image

on:
  schedule:
    # Poll away from the hour boundary. Only today's UTC+8 wheel is eligible.
    - cron: '17 * * * *'
  repository_dispatch:
    types:
      - rolling-wheel-published
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Rolling wheel release tag, e.g. v1.3.0-native-rolling-20260828. Leave empty for newest.'
        required: false
        type: string

concurrency:
  group: rolling-build-${{ github.repository }}
  cancel-in-progress: false

permissions:
  packages: write
  contents: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  ROLLING_WHEEL_REPOSITORY: DSYZayn/1Cat-vLLM
  # Enable future daily updates without backfilling the interrupted period.
  ROLLING_AUTO_START_DATE: '20261005'
  GH_TOKEN: ${{ github.token }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_build: ${{ steps.metadata.outputs.should_build }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      image_tag: ${{ steps.metadata.outputs.image_tag }}
      wheel_url: ${{ steps.metadata.outputs.wheel_url }}
      updated_at: ${{ steps.metadata.outputs.updated_at }}
      wheel_version: ${{ steps.metadata.outputs.wheel_version }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve rolling release metadata
        id: metadata
        env:
          EVENT_RELEASE_TAG: ${{ github.event.client_payload.release_tag }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: node .github/scripts/resolve-rolling-release.mjs

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          REGISTRY: ${{ env.REGISTRY }}
          VERSION: ${{ needs.check.outputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail
          image_lower="$(printf '%s' "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          image="${REGISTRY}/${image_lower}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "tag=${image}:${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Build and push rolling image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tag }}
          build-args: |
            VLLM_WHEEL_URL=${{ needs.check.outputs.wheel_url }}
            VLLM_WHEEL_RELEASE_TAG=${{ needs.check.outputs.release_tag }}
            VLLM_IMAGE_TAG=${{ needs.check.outputs.image_tag }}
            VLLM_IMAGE_KIND=rolling
          cache-from: type=gha,scope=rolling
          cache-to: type=gha,mode=max,scope=rolling

      - name: Create daily image release
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          IMAGE_RELEASE_TAG: rolling-${{ needs.check.outputs.image_tag }}
          VERSION: ${{ needs.check.outputs.image_tag }}
          SOURCE_RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.check.outputs.source_sha }}
          WHEEL_VERSION: ${{ needs.check.outputs.wheel_version }}
        shell: bash
        run: |
          set -euo pipefail

          notes_file="$RUNNER_TEMP/rolling-image-release-notes.md"
          cat > "$notes_file" <<EOF
          # Rolling Docker Image ${VERSION}

          - Image: \`${IMAGE}:${VERSION}\`
          - Source wheel release: [\`${SOURCE_RELEASE_TAG}\`](https://github.com/${ROLLING_WHEEL_REPOSITORY}/releases/tag/${SOURCE_RELEASE_TAG})
          - Wheel version: \`${WHEEL_VERSION:-unknown}\`
          - Source commit: \`${SOURCE_SHA:-not provided by manual run}\`

          This is a retained daily image release. The source wheel release
          contains the commit range and the AI-or-fallback change summary.
          EOF

          if gh release view "$IMAGE_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$IMAGE_RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Rolling Docker image ${VERSION}" \
              --notes-file "$notes_file" \
              --prerelease
          else
            gh release create "$IMAGE_RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Rolling Docker image ${VERSION}" \
              --notes-file "$notes_file" \
              --prerelease
          fi

          echo "Daily image release: ${IMAGE_RELEASE_TAG}"

      - name: Rolling image summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ needs.check.outputs.image_tag }}
          SOURCE_RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
          UPDATED_AT: ${{ needs.check.outputs.updated_at }}
          WHEEL_URL: ${{ needs.check.outputs.wheel_url }}
        shell: bash
        run: |
          {
            echo "### Rolling Docker Image Built"
            echo
            echo "Image: \`${IMAGE}:${VERSION}\`"
            echo "Source wheel release: ${SOURCE_RELEASE_TAG}"
            echo "Source wheel release updated: ${UPDATED_AT}"
            echo "Wheel: ${WHEEL_URL}"
            echo "Daily image release: rolling-${VERSION}"
            echo
            echo "The rolling image has no \`latest\` tag."
          } >> "${GITHUB_STEP_SUMMARY}"
